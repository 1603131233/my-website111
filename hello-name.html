<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>名字欢迎页</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
        }
        input {
            padding: 15px;
            font-size: 18px;
            border: 2px solid #ccc;
            border-radius: 8px;
            width: 250px;
            margin-bottom: 20px;
            text-align: center;
        }
        button {
            padding: 15px 40px;
            font-size: 18px;
            background-color: red;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        button:hover {
            background-color: darkred;
        }
    </style>
</head>
<body>
    <h1>欢迎来到AI世界</h1>
    <input type="text" id="nameInput" placeholder="请输入你的名字">
    <br>
    <button onclick="sayHello()">点我</button>

    <script>
        function sayHello() {
            var name = document.getElementById("nameInput").value;
            if (name == "") {
                alert("请先输入你的名字！");
            } else {
                alert("你好，" + name + "！欢迎来到AI世界！");
            }
        }
    </script>
</body>
</html>
