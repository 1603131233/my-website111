<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" data-trae-theme="dark"><head>
    <!-- 设置文档字符编码为 UTF-8 -->
    <meta charset="UTF-8">
    <!-- 让页面在手机端按设备宽度正确缩放 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 设置浏览器标签标题 -->
    <title>AI助手聊天机器人</title>
    <style>
        /* 定义浅色主题的全局颜色变量 */
        :root {
            /* 页面背景渐变起点颜色 */
            --body-bg-1: #ffe4ef;
            /* 页面背景渐变中间颜色 */
            --body-bg-2: #ffd3e6;
            /* 页面背景渐变终点颜色 */
            --body-bg-3: #ffc1dc;
            /* 卡片主体背景颜色 */
            --app-bg: rgba(255, 247, 251, 0.88);
            /* 卡片边框颜色 */
            --app-border: rgba(255, 255, 255, 0.72);
            /* 卡片阴影颜色 */
            --app-shadow: rgba(255, 105, 180, 0.18);
            /* 头部渐变起点颜色 */
            --header-bg-1: #ff89bb;
            /* 头部渐变终点颜色 */
            --header-bg-2: #ff6fa8;
            /* 头部文字颜色 */
            --header-text: #ffffff;
            /* 头部按钮背景颜色 */
            --header-btn-bg: rgba(255, 255, 255, 0.22);
            /* 头部按钮边框颜色 */
            --header-btn-border: rgba(255, 255, 255, 0.35);
            /* 头部按钮文字颜色 */
            --header-btn-text: #ffffff;
            /* 头部阴影颜色 */
            --header-shadow: rgba(255, 111, 168, 0.28);
            /* 聊天区域渐变起点颜色 */
            --chat-bg-1: rgba(255, 244, 249, 0.75);
            /* 聊天区域渐变终点颜色 */
            --chat-bg-2: rgba(255, 236, 244, 0.92);
            /* 页面主文字颜色 */
            --text-main: #333333;
            /* 次要文字颜色 */
            --text-sub: #b17895;
            /* 空状态文字颜色 */
            --empty-text: #a46684;
            /* AI 气泡背景颜色 */
            --ai-bubble-bg: #ffffff;
            /* AI 气泡文字颜色 */
            --ai-bubble-text: #333333;
            /* 用户气泡渐变起点颜色 */
            --user-bubble-bg-1: #ff8ebd;
            /* 用户气泡渐变终点颜色 */
            --user-bubble-bg-2: #ff6aa8;
            /* 用户气泡文字颜色 */
            --user-bubble-text: #ffffff;
            /* 消息阴影颜色 */
            --bubble-shadow: rgba(255, 105, 180, 0.08);
            /* 底部区域背景颜色 */
            --footer-bg: rgba(255, 255, 255, 0.86);
            /* 底部区域上边框颜色 */
            --footer-border: rgba(255, 174, 208, 0.35);
            /* 输入框边框颜色 */
            --input-border: #ffc0d9;
            /* 输入框背景颜色 */
            --input-bg: #fff9fc;
            /* 输入框文字颜色 */
            --input-text: #333333;
            /* 输入框聚焦边框颜色 */
            --input-focus: #ff82b7;
            /* 输入框聚焦光晕颜色 */
            --input-focus-shadow: rgba(255, 130, 183, 0.16);
            /* 主要按钮渐变起点颜色 */
            --primary-btn-1: #ff89bb;
            /* 主要按钮渐变终点颜色 */
            --primary-btn-2: #ff5fa1;
            /* 主要按钮文字颜色 */
            --primary-btn-text: #ffffff;
            /* 主要按钮阴影颜色 */
            --primary-btn-shadow: rgba(255, 95, 161, 0.28);
            /* 次级按钮背景颜色 */
            --secondary-btn-bg: rgba(255, 255, 255, 0.92);
            /* 次级按钮文字颜色 */
            --secondary-btn-text: #ff5fa1;
            /* 次级按钮边框颜色 */
            --secondary-btn-border: rgba(255, 95, 161, 0.18);
            /* 复制按钮背景颜色 */
            --copy-btn-bg: rgba(255, 255, 255, 0.92);
            /* 复制按钮文字颜色 */
            --copy-btn-text: #ff5fa1;
            /* 复制按钮边框颜色 */
            --copy-btn-border: rgba(255, 95, 161, 0.18);
            /* 滚动条颜色 */
            --scrollbar-thumb: rgba(255, 126, 181, 0.45);
            /* 加载圆点颜色 */
            --typing-dot: #ff83b6;
            /* Toast 背景颜色 */
            --toast-bg: rgba(51, 51, 51, 0.88);
            /* Toast 文字颜色 */
            --toast-text: #ffffff;
            /* 图标按钮背景颜色 */
            --icon-btn-bg: rgba(255, 255, 255, 0.92);
            /* 图标按钮边框颜色 */
            --icon-btn-border: rgba(255, 95, 161, 0.16);
            /* 图标按钮文字颜色 */
            --icon-btn-text: #ff5fa1;
        }

        /* 定义深色主题下覆盖的颜色变量 */
        body.dark-theme {
            /* 页面背景渐变起点颜色改为深色 */
            --body-bg-1: #241320;
            /* 页面背景渐变中间颜色改为深色 */
            --body-bg-2: #1b1320;
            /* 页面背景渐变终点颜色改为深色 */
            --body-bg-3: #120d15;
            /* 卡片主体背景颜色改为深色 */
            --app-bg: rgba(30, 24, 33, 0.92);
            /* 卡片边框颜色改为深色半透明 */
            --app-border: rgba(255, 166, 208, 0.16);
            /* 卡片阴影颜色改为更深 */
            --app-shadow: rgba(0, 0, 0, 0.35);
            /* 头部渐变起点颜色改为深粉色 */
            --header-bg-1: #6a2b53;
            /* 头部渐变终点颜色改为玫红色 */
            --header-bg-2: #a43d73;
            /* 头部文字颜色保持白色 */
            --header-text: #ffffff;
            /* 头部按钮背景颜色改为深色半透明 */
            --header-btn-bg: rgba(255, 255, 255, 0.08);
            /* 头部按钮边框颜色改为更柔和 */
            --header-btn-border: rgba(255, 255, 255, 0.14);
            /* 头部按钮文字颜色保持白色 */
            --header-btn-text: #ffffff;
            /* 头部阴影颜色改为更深 */
            --header-shadow: rgba(0, 0, 0, 0.22);
            /* 聊天区域渐变起点颜色改为深色 */
            --chat-bg-1: rgba(43, 32, 41, 0.92);
            /* 聊天区域渐变终点颜色改为深色 */
            --chat-bg-2: rgba(29, 23, 30, 0.98);
            /* 主文字颜色改为浅色 */
            --text-main: #f7ebf2;
            /* 次要文字颜色改为浅粉灰 */
            --text-sub: #d8abc4;
            /* 空状态文字颜色改为浅粉色 */
            --empty-text: #ebb7d2;
            /* AI 气泡背景改为深色 */
            --ai-bubble-bg: #342934;
            /* AI 气泡文字改为浅色 */
            --ai-bubble-text: #f8eff4;
            /* 用户气泡渐变起点改为深粉色 */
            --user-bubble-bg-1: #d65c97;
            /* 用户气泡渐变终点改为亮玫红 */
            --user-bubble-bg-2: #bb4f89;
            /* 用户气泡文字保持白色 */
            --user-bubble-text: #ffffff;
            /* 消息阴影改为更深 */
            --bubble-shadow: rgba(0, 0, 0, 0.2);
            /* 底部背景改为深色 */
            --footer-bg: rgba(28, 22, 29, 0.94);
            /* 底部边框改为深色粉边 */
            --footer-border: rgba(255, 174, 208, 0.14);
            /* 输入框边框改为深粉色 */
            --input-border: rgba(255, 166, 208, 0.22);
            /* 输入框背景改为深色 */
            --input-bg: #221b24;
            /* 输入框文字改为浅色 */
            --input-text: #f7ebf2;
            /* 输入框聚焦边框改为亮粉色 */
            --input-focus: #ff93c0;
            /* 输入框聚焦光晕改为亮粉色半透明 */
            --input-focus-shadow: rgba(255, 147, 192, 0.18);
            /* 主要按钮渐变起点改为亮粉色 */
            --primary-btn-1: #ff7ab5;
            /* 主要按钮渐变终点改为玫红 */
            --primary-btn-2: #d8518f;
            /* 主要按钮文字保持白色 */
            --primary-btn-text: #ffffff;
            /* 主要按钮阴影改为更深 */
            --primary-btn-shadow: rgba(0, 0, 0, 0.24);
            /* 次级按钮背景改为深色 */
            --secondary-btn-bg: rgba(52, 41, 52, 0.96);
            /* 次级按钮文字改为浅粉色 */
            --secondary-btn-text: #ffb3d5;
            /* 次级按钮边框改为半透明粉色 */
            --secondary-btn-border: rgba(255, 179, 213, 0.16);
            /* 复制按钮背景改为深色 */
            --copy-btn-bg: rgba(52, 41, 52, 0.96);
            /* 复制按钮文字改为浅粉色 */
            --copy-btn-text: #ffb3d5;
            /* 复制按钮边框改为半透明粉色 */
            --copy-btn-border: rgba(255, 179, 213, 0.16);
            /* 滚动条颜色改为浅粉色 */
            --scrollbar-thumb: rgba(255, 179, 213, 0.32);
            /* 加载圆点颜色改为浅粉色 */
            --typing-dot: #ff9ec8;
            /* Toast 背景颜色改为更深 */
            --toast-bg: rgba(17, 14, 18, 0.92);
            /* Toast 文字颜色保持白色 */
            --toast-text: #ffffff;
            /* 图标按钮背景改为深色 */
            --icon-btn-bg: rgba(52, 41, 52, 0.96);
            /* 图标按钮边框改为半透明粉色 */
            --icon-btn-border: rgba(255, 179, 213, 0.16);
            /* 图标按钮文字改为浅粉色 */
            --icon-btn-text: #ffb3d5;
        }

        /* 设置所有元素的盒模型和默认间距 */
        * {
            /* 让宽高计算包含内边距和边框 */
            box-sizing: border-box;
            /* 清除默认外边距 */
            margin: 0;
            /* 清除默认内边距 */
            padding: 0;
        }

        /* 设置页面整体外观 */
        body {
            /* 使用现代中文无衬线字体 */
            font-family: "Microsoft YaHei", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
            /* 应用粉色渐变背景 */
            background: linear-gradient(135deg, var(--body-bg-1) 0%, var(--body-bg-2) 45%, var(--body-bg-3) 100%);
            /* 页面最小高度占满视口 */
            min-height: 100vh;
            /* 使用弹性布局居中聊天卡片 */
            display: flex;
            /* 让聊天卡片水平居中 */
            justify-content: center;
            /* 让聊天卡片从顶部开始排列 */
            align-items: flex-start;
            /* 给页面四周留出空白 */
            padding: 24px 16px;
            /* 设置默认文字颜色 */
            color: var(--text-main);
            /* 添加主题切换过渡效果 */
            transition: background 0.3s ease, color 0.3s ease;
        }

        /* 设置聊天应用主容器 */
        .chat-app {
            /* 容器宽度占满可用空间 */
            width: 100%;
            /* 限制最大宽度，适合桌面端 */
            max-width: 920px;
            /* 设置容器高度 */
            height: calc(100vh - 48px);
            /* 设置容器最小高度 */
            min-height: 620px;
            /* 设置卡片半透明背景 */
            background: var(--app-bg);
            /* 添加毛玻璃模糊效果 */
            backdrop-filter: blur(18px);
            /* 设置大圆角 */
            border-radius: 28px;
            /* 添加柔和阴影 */
            box-shadow: 0 18px 45px var(--app-shadow);
            /* 使用纵向弹性布局 */
            display: flex;
            /* 子元素从上到下排列 */
            flex-direction: column;
            /* 隐藏超出卡片圆角的内容 */
            overflow: hidden;
            /* 添加半透明边框 */
            border: 1px solid var(--app-border);
            /* 添加主题切换过渡效果 */
            transition: background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }

        /* 设置顶部标题栏 */
        .chat-header {
            /* 应用头部粉色渐变背景 */
            background: linear-gradient(135deg, var(--header-bg-1) 0%, var(--header-bg-2) 100%);
            /* 设置头部文字颜色 */
            color: var(--header-text);
            /* 设置内边距 */
            padding: 18px 20px;
            /* 使用弹性布局横向排布 */
            display: flex;
            /* 两端对齐标题和按钮 */
            justify-content: space-between;
            /* 垂直方向居中 */
            align-items: center;
            /* 添加头部阴影 */
            box-shadow: 0 6px 20px var(--header-shadow);
            /* 添加切换过渡效果 */
            transition: background 0.3s ease, box-shadow 0.3s ease;
        }

        /* 设置左侧标题区域 */
        .header-left {
            /* 使用弹性布局 */
            display: flex;
            /* 垂直方向居中 */
            align-items: center;
            /* 元素之间留出间距 */
            gap: 12px;
        }

        /* 设置标题文字 */
        .chat-title {
            /* 设置字号 */
            font-size: 20px;
            /* 设置字体粗细 */
            font-weight: 700;
            /* 增加一点字间距 */
            letter-spacing: 1px;
        }

        /* 设置头部按钮区域 */
        .header-actions {
            /* 使用弹性布局 */
            display: flex;
            /* 按钮之间留间距 */
            gap: 10px;
            /* 垂直方向居中 */
            align-items: center;
        }

        /* 设置按钮通用样式 */
        .btn {
            /* 去掉默认边框 */
            border: none;
            /* 使用超大圆角 */
            border-radius: 999px;
            /* 设置按钮内边距 */
            padding: 10px 16px;
            /* 设置按钮文字大小 */
            font-size: 14px;
            /* 悬停时鼠标变手型 */
            cursor: pointer;
            /* 添加交互过渡效果 */
            transition: all 0.25s ease;
            /* 设置字重 */
            font-weight: 600;
            /* 防止按钮文字换行 */
            white-space: nowrap;
        }

        /* 设置头部按钮样式 */
        .btn-header {
            /* 使用头部按钮背景颜色 */
            background: var(--header-btn-bg);
            /* 设置头部按钮文字颜色 */
            color: var(--header-btn-text);
            /* 设置头部按钮边框 */
            border: 1px solid var(--header-btn-border);
        }

        /* 设置头部按钮悬停效果 */
        .btn-header:hover {
            /* 悬停时略微上移 */
            transform: translateY(-1px);
            /* 悬停时稍微提亮 */
            filter: brightness(1.05);
        }

        /* 设置主题切换按钮样式 */
        .theme-toggle-btn {
            /* 设置固定宽度 */
            width: 46px;
            /* 设置固定高度 */
            height: 46px;
            /* 使用内联弹性布局让图标居中 */
            display: inline-flex;
            /* 水平居中图标 */
            justify-content: center;
            /* 垂直居中图标 */
            align-items: center;
            /* 设置图标字号 */
            font-size: 20px;
            /* 减少左右内边距 */
            padding: 0;
        }

        /* 设置聊天主体区域 */
        .chat-body {
            /* 占据剩余全部空间 */
            flex: 1;
            /* 设置内边距 */
            padding: 22px 18px;
            /* 允许消息列表滚动 */
            overflow-y: auto;
            /* 使用纵向弹性布局 */
            display: flex;
            /* 子元素垂直排列 */
            flex-direction: column;
            /* 设置消息之间的间距 */
            gap: 16px;
            /* 应用聊天区背景渐变 */
            background: linear-gradient(180deg, var(--chat-bg-1) 0%, var(--chat-bg-2) 100%);
            /* 添加过渡效果 */
            transition: background 0.3s ease;
        }

        /* 设置空状态区域 */
        .empty-state {
            /* 让空状态自动在中间分布 */
            margin: auto;
            /* 让文字居中 */
            text-align: center;
            /* 设置文字颜色 */
            color: var(--empty-text);
            /* 设置行高 */
            line-height: 1.8;
        }

        /* 设置空状态标题 */
        .empty-state h2 {
            /* 设置字体大小 */
            font-size: 24px;
            /* 设置底部间距 */
            margin-bottom: 8px;
        }

        /* 设置空状态描述 */
        .empty-state p {
            /* 设置字体大小 */
            font-size: 15px;
        }

        /* 设置每一条消息所在行 */
        .message-row {
            /* 使用弹性布局 */
            display: flex;
            /* 顶部对齐消息内容 */
            align-items: flex-start;
        }

        /* 设置 AI 消息靠左 */
        .message-row.ai {
            /* 主轴从左侧开始排列 */
            justify-content: flex-start;
        }

        /* 设置用户消息靠右 */
        .message-row.user {
            /* 主轴从右侧开始排列 */
            justify-content: flex-end;
        }

        /* 设置消息包装容器 */
        .message-wrapper {
            /* 让消息区域最大宽度受控 */
            max-width: 82%;
            /* 使用纵向布局 */
            display: flex;
            /* 内容从上到下排列 */
            flex-direction: column;
            /* 元素之间留出间距 */
            gap: 6px;
        }

        /* 让用户侧消息包装靠右 */
        .message-row.user .message-wrapper {
            /* 让内部元素靠右排列 */
            align-items: flex-end;
        }

        /* 让 AI 侧消息包装靠左 */
        .message-row.ai .message-wrapper {
            /* 让内部元素靠左排列 */
            align-items: flex-start;
        }

        /* 设置消息气泡基础样式 */
        .message-bubble {
            /* 设置气泡内边距 */
            padding: 14px 16px;
            /* 设置大圆角 */
            border-radius: 20px;
            /* 保留换行和空格 */
            white-space: pre-wrap;
            /* 让长单词自动换行 */
            word-break: break-word;
            /* 设置行高 */
            line-height: 1.7;
            /* 设置字体大小 */
            font-size: 15px;
            /* 设置阴影 */
            box-shadow: 0 8px 20px var(--bubble-shadow);
            /* 方便后续扩展定位元素 */
            position: relative;
            /* 设置过渡效果 */
            transition: background 0.3s ease, color 0.3s ease, box-shadow 0.3s ease;
        }

        /* 设置 AI 气泡样式 */
        .message-row.ai .message-bubble {
            /* 设置 AI 气泡背景 */
            background: var(--ai-bubble-bg);
            /* 设置 AI 气泡文字颜色 */
            color: var(--ai-bubble-text);
            /* 设置左上角更像聊天气泡 */
            border-top-left-radius: 8px;
        }

        /* 设置用户气泡样式 */
        .message-row.user .message-bubble {
            /* 设置用户气泡渐变背景 */
            background: linear-gradient(135deg, var(--user-bubble-bg-1) 0%, var(--user-bubble-bg-2) 100%);
            /* 设置用户气泡文字颜色 */
            color: var(--user-bubble-text);
            /* 设置右上角更像聊天气泡 */
            border-top-right-radius: 8px;
        }

        /* 设置消息底部信息行 */
        .message-footer {
            /* 使用弹性布局 */
            display: flex;
            /* 垂直居中 */
            align-items: center;
            /* 元素之间留间距 */
            gap: 8px;
            /* 允许换行，兼容小屏 */
            flex-wrap: wrap;
        }

        /* 设置 AI 消息底部信息左对齐 */
        .message-row.ai .message-footer {
            /* 主轴从左开始 */
            justify-content: flex-start;
        }

        /* 设置用户消息底部信息右对齐 */
        .message-row.user .message-footer {
            /* 主轴从右开始 */
            justify-content: flex-end;
        }

        /* 设置消息角色标识文字 */
        .message-meta {
            /* 设置字体大小 */
            font-size: 12px;
            /* 设置字体颜色 */
            color: var(--text-sub);
            /* 留少量内边距提升观感 */
            padding: 0 6px;
        }

        /* 设置复制按钮样式 */
        .copy-btn {
            /* 使用柔和背景 */
            background: var(--copy-btn-bg);
            /* 设置文字颜色 */
            color: var(--copy-btn-text);
            /* 设置边框 */
            border: 1px solid var(--copy-btn-border);

                return;
            }

            // 获取输入框中的文本并去掉前后空格
            const messageText = userInput.value.trim();

            // 如果输入内容为空，则直接结束
            if (!messageText) {
                return;
            }

            // 如果还没有填写 API Key，则提示用户
            if (!API_KEY || API_KEY === "请在这里填写你的 Kimi API Key") {
                alert("请先在代码里填写你的 Kimi API Key，再进行测试。");
                return;
            }

            // 如果语音识别正在进行中，则先停止
            if (isListening) {
                stopSpeechRecognition();
            }

            // 把用户消息加入历史数组
            conversationHistory.push({
                role: "user",
                content: messageText
            });

            // 保存历史记录到本地
            saveConversationHistory();

            // 重新渲染消息列表
            renderAllMessages();

            // 清空输入框内容
            userInput.value = "";

            // 重新调整输入框高度
            autoResizeTextarea();

            // 创建加载中的临时消息
            const loadingRow = createLoadingMessage();

            // 更新按钮和输入框状态
            setLoadingState(true);

            try {
                // 调用接口获取 AI 回复
                const aiReply = await fetchKimiReply();

                // 删除临时加载消息
                loadingRow.remove();

                // 把 AI 回复加入历史数组
                conversationHistory.push({
                    role: "assistant",
                    content: aiReply
                });

                // 保存最新对话历史
                saveConversationHistory();

                // 重新渲染消息
                renderAllMessages();
            } catch (error) {
                // 删除临时加载消息
                loadingRow.remove();

                // 拼接错误提示文本
                const errorMessage = "请求失败：" + (error.message || "未知错误，请检查 API Key、接口地址或浏览器跨域设置。");

                // 把错误信息作为 AI 消息加入历史
                conversationHistory.push({
                    role: "assistant",
                    content: errorMessage
                });

                // 保存错误消息到本地
                saveConversationHistory();

                // 重新渲染消息
                renderAllMessages();
            } finally {
                // 请求结束后恢复界面状态
                setLoadingState(false);
            }
        }

        // 调用 Kimi API 获取回复的函数
        async function fetchKimiReply() {
            // 构造发送给模型的消息数组，包含系统提示词和全部上下文
            const messages = [
                {
                    role: "system",
                    content: SYSTEM_PROMPT
                },
                ...conversationHistory
            ];

            // 使用 fetch 发送 POST 请求
            const response = await fetch(API_URL, {
                // 指定请求方法
                method: "POST",
                // 设置请求头
                headers: {
                    // 声明发送 JSON 数据
                    "Content-Type": "application/json",
                    // 通过 Bearer Token 传递 API Key
                    "Authorization": `Bearer ${API_KEY}`
                },
                // 设置请求体
                body: JSON.stringify({
                    // 指定模型名称
                    model: MODEL_NAME,
                    // 传入完整消息数组
                    messages: messages,
                    // 指定温度参数
                    temperature: TEMPERATURE
                })
            });

            // 如果响应状态不是成功，则尝试解析错误信息
            if (!response.ok) {
                // 先准备一个错误文本变量
                let errorText = "";

                try {
                    // 尝试把错误响应解析成 JSON
                    const errorData = await response.json();

                    // 提取接口返回的错误信息
                    errorText = errorData.error?.message || JSON.stringify(errorData);
                } catch (parseError) {
                    // 如果不是 JSON，则读取原始文本
                    errorText = await response.text();
                }

                // 抛出错误给上层捕获
                throw new Error(errorText || `HTTP ${response.status}`);
            }

            // 把成功响应解析成 JSON
            const data = await response.json();

            // 读取标准 chat completions 结构中的回复内容
            const replyText = data.choices?.[0]?.message?.content;

            // 如果没有拿到有效回复，则抛出异常
            if (!replyText) {
                throw new Error("接口已返回结果，但没有读取到有效回复内容。");
            }

            // 返回 AI 回复文本
            return replyText;
        }

        // 清空全部对话记录的函数
        function clearConversation() {
            // 弹出确认框，防止误操作
            const confirmed = window.confirm("确定要清空全部对话记录吗？");

            // 如果用户取消，则不继续执行
            if (!confirmed) {
                return;
            }

            // 清空内存中的历史数组
            conversationHistory = [];

            // 删除本地存储中的历史消息
            localStorage.removeItem(STORAGE_KEY);

            // 重新渲染消息区域
            renderAllMessages();

            // 给出操作提示
            showToast("对话已清空");
        }

        // 切换深色和浅色主题的函数
        function toggleTheme() {
            // 判断当前 body 是否已经是深色主题
            const isDarkMode = document.body.classList.toggle("dark-theme");

            // 根据当前主题更新按钮图标
            updateThemeButton(isDarkMode);

            // 把主题模式保存到本地存储
            localStorage.setItem(THEME_STORAGE_KEY, isDarkMode ? "dark" : "light");

            // 给出切换成功提示
            showToast(isDarkMode ? "已切换为深色主题" : "已切换为浅色主题");
        }

        // 初始化语音识别的函数
        function initSpeechRecognition() {
            // 如果浏览器不支持 Web Speech API，则禁用语音按钮
            if (!SpeechRecognitionConstructor) {
                voiceBtn.disabled = true;
                voiceBtn.title = "当前浏览器不支持语音识别";
                return;
            }

            // 创建语音识别实例
            recognition = new SpeechRecognitionConstructor();

            // 设置识别语言为中文
            recognition.lang = "zh-CN";

            // 只识别一次，不持续监听
            recognition.continuous = false;

            // 开启中间结果，提升实时反馈体验
            recognition.interimResults = true;

            // 设置备选结果数量为 1
            recognition.maxAlternatives = 1;

            // 当语音识别真正开始时更新状态
            recognition.onstart = () => {
                isListening = true;
                updateVoiceButtonState();
                showToast("开始语音输入，请说话...");
            };

            // 当识别到结果时，把文字填入输入框
            recognition.onresult = (event) => {
                let finalText = "";
                let interimText = "";

                for (let index = event.resultIndex; index < event.results.length; index += 1) {
                    if (event.results[index].isFinal) {
                        finalText += event.results[index][0].transcript;
                    } else {
                        interimText += event.results[index][0].transcript;
                    }
                }

                const mergedText = (finalText || interimText).trim();

                if (mergedText) {
                    const prefix = userInput.value.trim();
                    userInput.value = prefix ? `${prefix}${prefix.endsWith(" ") ? "" : " "}${mergedText}` : mergedText;
                    autoResizeTextarea();
                }
            };

            // 当识别报错时给出提示
            recognition.onerror = (event) => {
                if (event.error === "not-allowed") {
                    showToast("请允许浏览器使用麦克风");
                } else if (event.error === "no-speech") {
                    showToast("没有识别到语音，请再试一次");
                } else {
                    showToast(`语音识别失败：${event.error}`);
                }
            };

            // 当语音识别结束时恢复按钮状态
            recognition.onend = () => {
                isListening = false;
                updateVoiceButtonState();
            };
        }

        // 切换语音识别开关的函数
        function toggleSpeechRecognition() {
            // 如果浏览器不支持语音识别，则提示用户
            if (!recognition) {
                showToast("当前浏览器不支持语音识别");
                return;
            }

            // 如果当前正在加载，则不允许开启语音
            if (isLoading) {
                return;
            }

            // 如果当前已经在监听，则执行停止
            if (isListening) {
                stopSpeechRecognition();
                showToast("已停止语音输入");
                return;
            }

            try {
                recognition.start();
            } catch (error) {
                showToast("语音识别暂时无法启动，请稍后重试");
            }
        }

        // 停止语音识别的函数
        function stopSpeechRecognition() {
            // 如果存在识别实例并且当前正在监听，则执行停止
            if (recognition && isListening) {
                recognition.stop();
            }
        }

        // 复制 AI 回复内容的函数
        async function copyMessage(messageText, buttonElement) {
            try {
                // 优先使用现代剪贴板 API 复制文本
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(messageText);
                } else {
                    // 如果现代 API 不可用，则退回到传统复制方案
                    fallbackCopyText(messageText);
                }

                // 修改按钮文字提示复制成功
                const originalText = buttonElement.textContent;
                buttonElement.textContent = "已复制";

                // 显示底部 Toast 提示
                showToast("已复制");

                // 一段时间后恢复按钮原文字
                window.setTimeout(() => {
                    buttonElement.textContent = originalText;
                }, 1200);
            } catch (error) {
                // 复制失败时给出提示
                showToast("复制失败，请手动复制");
            }
        }

        // 传统复制文本的兜底函数
        function fallbackCopyText(text) {
            // 创建一个临时 textarea 元素
            const tempTextarea = document.createElement("textarea");

            // 设置临时文本框的值
            tempTextarea.value = text;

            // 放到页面中但移出可视区域
            tempTextarea.style.position = "fixed";
            tempTextarea.style.left = "-9999px";
            tempTextarea.style.top = "0";

            // 把临时文本框插入文档
            document.body.appendChild(tempTextarea);

            // 选中文本
            tempTextarea.focus();
            tempTextarea.select();

            // 执行复制命令
            document.execCommand("copy");

            // 删除临时文本框
            document.body.removeChild(tempTextarea);
        }

        // ========================= 渲染区域 =========================

        // 渲染全部消息的函数
        function renderAllMessages() {
            // 先清空聊天区域内容
            chatBody.innerHTML = "";

            // 如果没有历史消息，则显示空状态
            if (conversationHistory.length === 0) {
                chatBody.appendChild(emptyState);
                return;
            }

            // 遍历历史消息数组
            conversationHistory.forEach((message) => {
                // 创建消息行元素
                const messageRow = document.createElement("div");

                // 根据角色设置不同类名
                messageRow.className = `message-row ${message.role === "user" ? "user" : "ai"}`;

                // 创建消息包装容器
                const messageWrapper = document.createElement("div");

                // 添加包装容器类名
                messageWrapper.className = "message-wrapper";

                // 创建消息气泡元素
                const bubble = document.createElement("div");

                // 添加气泡样式类
                bubble.className = "message-bubble";

                // 写入消息文本内容
                bubble.textContent = message.content;

                // 创建底部信息行
                const footer = document.createElement("div");

                // 添加底部信息行类名
                footer.className = "message-footer";

                // 创建角色标识文字
                const meta = document.createElement("div");

                // 添加文字类名
                meta.className = "message-meta";

                // 根据角色显示不同的名称
                meta.textContent = message.role === "user" ? "我" : "AI助手";

                // 把角色标识加入底部信息行
                footer.appendChild(meta);

                // 如果当前消息是 AI 回复，则额外添加复制按钮
                if (message.role === "assistant") {
                    const copyBtn = document.createElement("button");
                    copyBtn.className = "copy-btn";
                    copyBtn.textContent = "复制";
                    copyBtn.addEventListener("click", () => {
                        copyMessage(message.content, copyBtn);
                    });
                    footer.appendChild(copyBtn);
                }

                // 把气泡加入包装容器
                messageWrapper.appendChild(bubble);

                // 把底部信息行加入包装容器
                messageWrapper.appendChild(footer);

                // 把包装容器加入消息行
                messageRow.appendChild(messageWrapper);

                // 把消息行加入聊天区域
                chatBody.appendChild(messageRow);
            });

            // 渲染完成后滚动到底部
            scrollToBottom();
        }

        // 创建“AI思考中”临时消息的函数
        function createLoadingMessage() {
            // 创建消息行元素
            const loadingRow = document.createElement("div");

            // 设置为 AI 消息行样式
            loadingRow.className = "message-row ai";

            // 创建消息包装容器
            const messageWrapper = document.createElement("div");

            // 设置包装容器类名
            messageWrapper.className = "message-wrapper";

            // 创建消息气泡元素
            const bubble = document.createElement("div");

            // 设置气泡样式类名
            bubble.className = "message-bubble";

            // 插入加载中的文案和动画点
            bubble.innerHTML = `
                AI思考中...
                <span class="typing-dots">
                    <span></span>
                    <span></span>
                    <span></span>
                </span>
            `;

            // 创建底部信息行
            const footer = document.createElement("div");

            // 设置底部信息样式类
            footer.className = "message-footer";

            // 创建角色标签元素
            const meta = document.createElement("div");

            // 设置角色标签样式类
            meta.className = "message-meta";

            // 设置角色标签内容
            meta.textContent = "AI助手";

            // 把角色标签加入底部信息行
            footer.appendChild(meta);

            // 把气泡加入包装容器
            messageWrapper.appendChild(bubble);

            // 把底部信息行加入包装容器
            messageWrapper.appendChild(footer);

            // 把包装容器加入消息行
            loadingRow.appendChild(messageWrapper);

            // 把加载消息插入聊天区域
            chatBody.appendChild(loadingRow);

            // 滚动到底部，让加载提示可见
            scrollToBottom();

            // 返回这个临时消息元素
            return loadingRow;
        }

        // ========================= 工具函数区域 =========================

        // 保存对话历史到本地存储
        function saveConversationHistory() {
            // 把历史数组转换成 JSON 字符串后保存
            localStorage.setItem(STORAGE_KEY, JSON.stringify(conversationHistory));
        }

        // 从本地存储加载对话历史
        function loadConversationHistory() {
            // 读取本地存储中的原始数据
            const savedData = localStorage.getItem(STORAGE_KEY);

            // 如果没有历史记录，则直接结束
            if (!savedData) {
                return;
            }

            try {
                // 把 JSON 字符串解析成数组
                const parsedData = JSON.parse(savedData);

                // 只有在解析结果是数组时才使用
                if (Array.isArray(parsedData)) {
                    conversationHistory = parsedData;
                }
            } catch (error) {
                // 如果本地数据损坏，则删除该数据
                localStorage.removeItem(STORAGE_KEY);
            }
        }

        // 从本地存储加载主题模式
        function loadThemeMode() {
            // 读取保存的主题模式
            const savedTheme = localStorage.getItem(THEME_STORAGE_KEY);

            // 如果保存的是深色主题，则给 body 添加深色类名
            if (savedTheme === "dark") {
                document.body.classList.add("dark-theme");
                updateThemeButton(true);
                return;
            }

            // 默认使用浅色主题并更新按钮
            updateThemeButton(false);
        }

        // 更新主题按钮显示图标的函数
        function updateThemeButton(isDarkMode) {
            // 深色主题显示太阳，提示可切回浅色
            themeToggleBtn.textContent = isDarkMode ? "☀️" : "🌙";

            // 同步更新按钮提示文字
            themeToggleBtn.title = isDarkMode ? "切换到浅色主题" : "切换到深色主题";
        }

        // 更新语音按钮显示状态的函数
        function updateVoiceButtonState() {
            // 根据当前状态切换类名
            voiceBtn.classList.toggle("is-listening", isListening);

            // 根据当前状态切换按钮图标
            voiceBtn.textContent = isListening ? "⏹" : "🎤";

            // 根据当前状态切换提示文字
            voiceBtn.title = isListening ? "停止语音输入" : "语音输入";
        }

        // 自动调整输入框高度的函数
        function autoResizeTextarea() {
            // 先把高度设置为 auto，便于重新计算
            userInput.style.height = "auto";

            // 再根据内容高度设置最终高度
            userInput.style.height = `${userInput.scrollHeight}px`;
        }

        // 设置发送状态的函数
        function setLoadingState(loading) {
            // 记录当前加载状态
            isLoading = loading;

            // 发送按钮在加载时禁用
            sendBtn.disabled = loading;

            // 清空按钮在加载时禁用
            clearBtn.disabled = loading;

            // 输入框在加载时禁用
            userInput.disabled = loading;

            // 语音按钮在加载时禁用
            voiceBtn.disabled = loading || !SpeechRecognitionConstructor;

            // 根据状态切换发送按钮文字
            sendBtn.textContent = loading ? "发送中..." : "发送";

            // 请求结束后恢复输入焦点
            if (!loading) {
                userInput.focus();
            }
        }

        // 显示底部 Toast 提示的函数
        function showToast(message) {
            // 设置提示文本
            toast.textContent = message;

            // 显示 Toast
            toast.classList.add("show");

            // 如果之前有定时器，则先清除
            if (toastTimer) {
                window.clearTimeout(toastTimer);
            }

            // 设置新的自动隐藏定时器
            toastTimer = window.setTimeout(() => {
                toast.classList.remove("show");
            }, 1600);
        }

        // 滚动到聊天区域底部的函数
        function scrollToBottom() {
            // 平滑滚动到最底部
            chatBody.scrollTo({
                top: chatBody.scrollHeight,
                behavior: "smooth"
            });
        }
    </script>
