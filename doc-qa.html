<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" data-trae-theme="dark"><!-- 设置页面语言为中文 --><head> <!-- 头部开始 -->
  <meta charset="UTF-8"> <!-- 设置字符编码为 UTF-8，避免中文乱码 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- 让页面在手机和电脑上都能正常缩放 -->
  <title>📚 文档问答助手</title> <!-- 设置浏览器标签标题 -->
  <style> /* 页面样式开始 */
    * { /* 统一处理所有元素的默认盒模型和间距 */
      box-sizing: border-box; /* 让宽高计算包含内边距和边框，布局更稳定 */
      margin: 0; /* 清除默认外边距 */
      padding: 0; /* 清除默认内边距 */
    } /* 通用重置结束 */

    body { /* 页面主体样式 */
      min-height: 100vh; /* 页面最小高度等于整个视口高度 */
      font-family: "Microsoft YaHei", "PingFang SC", "Helvetica Neue", Arial, sans-serif; /* 设置现代中文优先字体 */
      background: linear-gradient(135deg, #fff3f8 0%, #ffe4f1 50%, #ffd6ea 100%); /* 设置粉色渐变背景 */
      color: #5b3350; /* 设置主要文字颜色 */
      display: flex; /* 使用弹性布局让内部容器更容易居中 */
      justify-content: center; /* 水平居中主内容 */
      align-items: stretch; /* 让子元素纵向拉伸 */
      padding: 24px; /* 给页面四周留出呼吸感空间 */
    } /* 页面主体样式结束 */

    .app { /* 整个应用外层容器 */
      width: min(1200px, 100%); /* 最大宽度 1200px，同时兼容小屏幕 */
      background: rgba(255, 255, 255, 0.78); /* 设置带透明度的白色背景 */
      backdrop-filter: blur(18px); /* 做出毛玻璃效果，增强现代感 */
      border: 1px solid rgba(255, 255, 255, 0.6); /* 增加柔和边框 */
      border-radius: 28px; /* 大圆角风格 */
      box-shadow: 0 22px 60px rgba(219, 112, 147, 0.18); /* 添加粉色阴影提升层次感 */
      overflow: hidden; /* 防止内部内容超出圆角区域 */
      display: flex; /* 使用弹性布局组织头部和主体区域 */
      flex-direction: column; /* 垂直排列头部和内容区域 */
    } /* 应用外层容器结束 */

    .header { /* 顶部标题栏样式 */
      padding: 24px 28px 18px; /* 设置上下左右内边距 */
      background: linear-gradient(135deg, rgba(255, 183, 213, 0.85), rgba(255, 214, 234, 0.75)); /* 使用浅粉渐变标题背景 */
      border-bottom: 1px solid rgba(255, 255, 255, 0.7); /* 增加分隔线 */
    } /* 顶部标题栏样式结束 */

    .header h1 { /* 标题文字样式 */
      font-size: clamp(24px, 3vw, 34px); /* 根据屏幕宽度自适应标题大小 */
      font-weight: 800; /* 让标题更醒目 */
      letter-spacing: 0.5px; /* 稍微增加字间距，显得更精致 */
    } /* 标题文字样式结束 */

    .header p { /* 标题下方说明文字样式 */
      margin-top: 8px; /* 与标题保持适当距离 */
      color: #8a5a79; /* 设置浅一点的粉棕色文字 */
      font-size: 14px; /* 设置说明文字大小 */
    } /* 标题下方说明结束 */

    .main { /* 主体区域布局 */
      display: grid; /* 使用网格布局实现左右分栏 */
      grid-template-columns: 1.05fr 0.95fr; /* 左侧文档区域略宽，右侧问答区域略窄 */
      gap: 20px; /* 两栏之间留出间距 */
      padding: 22px; /* 主体区域内边距 */
    } /* 主体区域布局结束 */

    .panel { /* 每个卡片面板的基础样式 */
      background: rgba(255, 255, 255, 0.82); /* 面板背景为半透明白色 */
      border: 1px solid rgba(255, 210, 228, 0.9); /* 增加柔和粉边框 */
      border-radius: 24px; /* 面板圆角 */
      padding: 18px; /* 面板内边距 */
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.9); /* 内部高光让卡片更通透 */
      display: flex; /* 使用弹性布局便于纵向排列内容 */
      flex-direction: column; /* 面板内元素垂直排列 */
      min-height: 580px; /* 让桌面端高度更协调 */
    } /* 面板基础样式结束 */

    .panel-title { /* 面板标题样式 */
      font-size: 18px; /* 设置标题字号 */
      font-weight: 700; /* 设置标题加粗 */
      margin-bottom: 12px; /* 与下方内容留间距 */
      color: #b24d7c; /* 使用更醒目的粉色 */
    } /* 面板标题样式结束 */

    .panel-desc { /* 面板说明样式 */
      font-size: 13px; /* 说明文字大小 */
      line-height: 1.7; /* 增加行高提升可读性 */
      color: #8d6680; /* 使用柔和的说明文字颜色 */
      margin-bottom: 14px; /* 与正文控件留间距 */
    } /* 面板说明样式结束 */

    textarea,
    input { /* 统一处理输入类控件外观 */
      width: 100%; /* 控件宽度占满父容器 */
      border: 1px solid #f1bfd3; /* 设置浅粉边框 */
      background: rgba(255, 248, 252, 0.95); /* 设置淡粉背景 */
      color: #5b3350; /* 设置文字颜色 */
      border-radius: 18px; /* 输入框圆角 */
      outline: none; /* 去掉默认焦点轮廓 */
      transition: all 0.22s ease; /* 焦点变化时更顺滑 */
      font-size: 15px; /* 设置输入文字大小 */
    } /* 输入控件统一样式结束 */

    textarea:focus,
    input:focus { /* 聚焦时高亮效果 */
      border-color: #e78bb1; /* 聚焦时边框更明显 */
      box-shadow: 0 0 0 4px rgba(231, 139, 177, 0.16); /* 聚焦时加粉色发光外圈 */
      background: #fffaff; /* 聚焦时背景稍微更亮 */
    } /* 聚焦效果结束 */

    #documentInput { /* 文档输入区域样式 */
      flex: 1; /* 让文本框尽可能占满剩余高度 */
      resize: vertical; /* 允许用户手动拉伸高度 */
      min-height: 360px; /* 设置一个舒适的最小高度 */
      padding: 18px; /* 文本区域内边距 */
      line-height: 1.8; /* 提高阅读与输入舒适度 */
    } /* 文档输入区域结束 */

    .right-panel { /* 右侧问答面板样式 */
      min-height: 580px; /* 保持与左侧面板视觉高度一致 */
    } /* 右侧问答面板结束 */

    .chat-box { /* 聊天记录容器样式 */
      flex: 1; /* 占据右侧面板大部分空间 */
      min-height: 300px; /* 设定最小高度，避免过短 */
      max-height: 420px; /* 限制最大高度，防止页面过长 */
      overflow-y: auto; /* 内容过多时允许垂直滚动 */
      padding-right: 6px; /* 给滚动条预留一点空间 */
      display: flex; /* 使用弹性布局排列消息 */
      flex-direction: column; /* 消息纵向排列 */
      gap: 12px; /* 消息之间留空隙 */
      margin-bottom: 16px; /* 与下方输入区留间距 */
    } /* 聊天记录容器结束 */

    .message { /* 单条消息卡片样式 */
      padding: 14px 16px; /* 消息内部留白 */
      border-radius: 18px; /* 消息气泡圆角 */
      line-height: 1.8; /* 增加行高使内容更易读 */
      white-space: pre-wrap; /* 保留换行并自动换行 */
      word-break: break-word; /* 长文本自动断行 */
      font-size: 14px; /* 设置消息文字大小 */
      box-shadow: 0 8px 20px rgba(234, 167, 191, 0.12); /* 消息卡片添加柔和阴影 */
    } /* 单条消息样式结束 */

    .message.user { /* 用户消息样式 */
      align-self: flex-end; /* 让用户消息靠右显示 */
      background: linear-gradient(135deg, #ffb9d4, #ffcadf); /* 使用较亮的粉色渐变 */
      color: #6a2346; /* 设置文字颜色 */
    } /* 用户消息样式结束 */

    .message.assistant { /* AI 消息样式 */
      align-self: flex-start; /* 让 AI 消息靠左显示 */
      background: linear-gradient(135deg, #fff7fb, #ffeef6); /* 使用更淡的粉白渐变 */
      color: #69485d; /* 设置柔和的深色文字 */
      border: 1px solid #ffd6e7; /* 增加边框让层次更清楚 */
    } /* AI 消息样式结束 */

    .message.system { /* 系统提示消息样式 */
      align-self: center; /* 让系统提示居中显示 */
      background: rgba(255, 245, 250, 0.88); /* 使用轻微透明浅粉背景 */
      color: #9a6d87; /* 设置温和的提示文字颜色 */
      border: 1px dashed #efb8cf; /* 用虚线强调这是提示信息 */
      box-shadow: none; /* 系统提示不需要太强阴影 */
    } /* 系统提示消息样式结束 */

    .question-area { /* 问题输入区域容器 */
      display: flex; /* 使用纵向布局排列标签、输入框和按钮 */
      flex-direction: column; /* 子元素垂直排列 */
      gap: 12px; /* 各元素之间保持间距 */
    } /* 问题输入区域容器结束 */

    .question-label { /* 问题区域标题样式 */
      font-size: 15px; /* 设置字号 */
      font-weight: 700; /* 加粗显示 */
      color: #b24d7c; /* 使用主题粉色 */
    } /* 问题区域标题结束 */

    #questionInput { /* 问题输入框样式 */
      padding: 14px 16px; /* 设置输入框内边距 */
      min-height: 52px; /* 让输入框高度更舒适 */
    } /* 问题输入框样式结束 */

    .button-row { /* 按钮排列容器 */
      display: flex; /* 使用弹性布局横向排列按钮 */
      gap: 12px; /* 按钮之间留间距 */
      flex-wrap: wrap; /* 小屏幕时按钮允许自动换行 */
    } /* 按钮排列容器结束 */

    button { /* 所有按钮的统一样式 */
      border: none; /* 去掉默认边框 */
      border-radius: 999px; /* 胶囊按钮风格 */
      padding: 13px 22px; /* 设置按钮内边距 */
      font-size: 15px; /* 设置按钮文字大小 */
      font-weight: 700; /* 按钮文字加粗 */
      cursor: pointer; /* 鼠标悬停时显示手型 */
      transition: transform 0.18s ease, box-shadow 0.18s ease, opacity 0.18s ease; /* 让交互动效更顺滑 */
    } /* 按钮统一样式结束 */

    button:hover { /* 按钮悬停效果 */
      transform: translateY(-1px); /* 轻微上浮 */
      box-shadow: 0 10px 22px rgba(219, 112, 147, 0.18); /* 添加阴影增强反馈 */
    } /* 按钮悬停效果结束 */

    button:disabled { /* 按钮禁用状态 */
      cursor: not-allowed; /* 禁止状态下显示不可点击光标 */
      opacity: 0.65; /* 降低透明度表示不可操作 */
      transform: none; /* 禁用时不需要位移动效 */
      box-shadow: none; /* 禁用时去掉阴影 */
    } /* 按钮禁用状态结束 */

    .send-btn { /* 发送按钮样式 */
      background: linear-gradient(135deg, #ff72af, #ff95c2); /* 使用更亮的粉色渐变突出主按钮 */
      color: white; /* 白色文字更清晰 */
      flex: 1; /* 在可用空间里优先扩展 */
      min-width: 140px; /* 设置最小宽度防止太窄 */
    } /* 发送按钮样式结束 */

    .clear-btn { /* 清空按钮样式 */
      background: linear-gradient(135deg, #ffd6e8, #ffe8f2); /* 使用淡粉渐变作为次按钮 */
      color: #9e5479; /* 文字颜色与主题保持一致 */
      min-width: 120px; /* 设定最小宽度 */
    } /* 清空按钮样式结束 */

    .status-bar { /* 底部状态栏样式 */
      margin-top: 12px; /* 与按钮区保持距离 */
      font-size: 13px; /* 状态文字稍小一些 */
      color: #8f6880; /* 使用柔和文字颜色 */
      min-height: 20px; /* 保证状态区域高度稳定，不会跳动 */
    } /* 底部状态栏结束 */

    .tip-box { /* 顶部提示卡片样式 */
      margin-top: 14px; /* 与说明文字拉开距离 */
      background: rgba(255, 245, 250, 0.8); /* 设置淡粉提示背景 */
      border: 1px solid rgba(255, 206, 226, 0.95); /* 增加粉色边框 */
      border-radius: 18px; /* 提示卡片圆角 */
      padding: 12px 14px; /* 提示卡片内边距 */
      font-size: 13px; /* 提示文字大小 */
      line-height: 1.75; /* 提示文字行高 */
      color: #8d6680; /* 提示文字颜色 */
    } /* 顶部提示卡片结束 */

    .tip-box code { /* 提示卡片里的代码样式 */
      background: rgba(255, 215, 232, 0.55); /* 给代码片段加浅粉底色 */
      padding: 2px 7px; /* 让代码片段更好看 */
      border-radius: 999px; /* 让代码片段呈胶囊状 */
      font-family: Consolas, "Courier New", monospace; /* 使用等宽字体 */
    } /* 提示卡片代码样式结束 */

    @media (max-width: 900px) { /* 当屏幕宽度小于等于 900px 时启用平板/手机布局 */
      body { /* 调整小屏设备页面边距 */
        padding: 14px; /* 减少外边距，让内容更充分利用屏幕 */
      } /* 小屏 body 调整结束 */

      .main { /* 主体区域切换为单列布局 */
        grid-template-columns: 1fr; /* 左右布局改为上下布局 */
        padding: 16px; /* 减少内边距以适应小屏 */
      } /* 主体区域小屏布局结束 */

      .panel { /* 小屏时面板高度适当放开 */
        min-height: auto; /* 不强制固定高度，避免手机端过长 */
      } /* 小屏面板调整结束 */

      .right-panel { /* 右侧面板小屏适配 */
        min-height: auto; /* 手机上不固定最小高度 */
      } /* 右侧面板小屏适配结束 */

      .chat-box { /* 小屏下聊天区域高度调小 */
        max-height: 320px; /* 避免聊天记录撑满手机屏幕 */
      } /* 聊天区域小屏调整结束 */
    } /* 响应式样式结束 */
  </style> <!-- 页面样式结束 -->

        { role: "system", content: `以下是用户提供的文档内容，请你后续回答时只以这份文档为依据：\n\n${documentText}` } // 第二条消息把完整文档注入到上下文中
      ]; // 消息数组初始内容结束

      chatHistory.forEach((item) => { // 遍历已有对话历史，支持连续追问
        messages.push({ role: item.role, content: item.content }); // 把历史消息依次加入模型上下文
      }); // 历史消息追加结束

      messages.push({ role: "user", content: questionText }); // 最后一条加入当前用户问题
      return messages; // 返回完整消息数组
    } // 构造消息数组函数结束

    async function askKimi() { // 定义发送请求到 Kimi 的异步函数
      if (isRequesting) { // 如果已经在请求中，就不再重复发送
        return; // 直接结束本次调用
      } // 重复发送判断结束

      const documentText = documentInput.value.trim(); // 读取并去除文档输入内容首尾空格
      const questionText = questionInput.value.trim(); // 读取并去除问题输入内容首尾空格

      if (!documentText) { // 如果文档内容为空
        setStatus("请先粘贴文档内容。"); // 在状态栏提示用户先输入文档
        documentInput.focus(); // 自动聚焦到文档输入框
        return; // 结束函数，避免继续请求
      } // 文档为空判断结束

      if (!questionText) { // 如果问题内容为空
        setStatus("请输入你想问的问题。"); // 提示用户输入问题
        questionInput.focus(); // 自动聚焦到问题输入框
        return; // 结束函数
      } // 问题为空判断结束

      if (!API_KEY || API_KEY.includes("请在这里填写")) { // 如果用户还没有填写 API Key
        setStatus("请先在代码里填写 API_KEY。"); // 提示先配置 Key
        alert("请先把页面代码里的 API_KEY 改成你自己的 Kimi API Key。"); // 弹窗提醒用户修改配置
        return; // 结束函数
      } // API Key 校验结束

      if (currentDocument && currentDocument !== documentText) { // 如果之前已有文档且用户改了文档内容
        chatHistory = []; // 清空旧的追问历史，避免混入上一个文档上下文
        resetChatBox(); // 重置聊天显示区域
        addMessage("system", "检测到文档内容已更新，已自动清空旧对话历史。"); // 给出提示说明已切换到新文档
      } // 文档切换判断结束

      currentDocument = documentText; // 把当前文档保存下来，便于后续比较是否发生变化
      isRequesting = true; // 标记当前进入请求状态
      sendBtn.disabled = true; // 禁用发送按钮，防止重复点击
      clearBtn.disabled = true; // 请求过程中也暂时禁用清空按钮，避免状态冲突

      addMessage("user", questionText); // 把用户问题先显示到聊天记录中
      setStatus("正在调用 Kimi API，请稍候..."); // 更新状态栏提示

      try { // 开始尝试发起网络请求
        const messages = buildMessages(documentText, questionText); // 根据文档、历史和当前问题构造消息数组

        const response = await fetch(API_URL, { // 调用浏览器 fetch 向 Kimi 接口发送 POST 请求
          method: "POST", // 指定请求方法为 POST
          headers: { // 设置请求头
            "Content-Type": "application/json", // 说明发送的是 JSON 数据
            Authorization: `Bearer ${API_KEY}` // 把 API Key 放到 Bearer 鉴权头中
          }, // 请求头结束
          body: JSON.stringify({ // 把请求体转换成 JSON 字符串
            model: MODEL_NAME, // 指定模型名称
            temperature: TEMPERATURE, // 指定 temperature 参数
            messages: messages // 传入完整上下文消息数组
          }) // 请求体对象结束
        }); // fetch 请求结束

        if (!response.ok) { // 如果接口返回的 HTTP 状态不是成功
          const errorText = await response.text(); // 读取错误原始文本，方便定位问题
          throw new Error(`请求失败：${response.status} ${response.statusText}\n${errorText}`); // 抛出详细错误信息
        } // HTTP 状态判断结束

        const data = await response.json(); // 将接口返回结果解析为 JSON 对象
        const answer = data?.choices?.[0]?.message?.content?.trim() || "根据文档内容，我无法找到相关信息"; // 尝试从标准响应结构中取出模型回答

        addMessage("assistant", answer); // 把模型回答显示到聊天记录中
        chatHistory.push({ role: "user", content: questionText }); // 把本次用户问题写入历史，供下次追问使用
        chatHistory.push({ role: "assistant", content: answer }); // 把本次助手回答也写入历史
        questionInput.value = ""; // 清空问题输入框，方便继续追问
        questionInput.focus(); // 自动把焦点放回问题输入框
        setStatus("回答完成，可以继续追问。"); // 更新状态栏为完成状态
      } catch (error) { // 如果请求过程中出现异常
        console.error("调用 Kimi API 时出错：", error); // 在控制台输出详细错误，便于调试
        addMessage("assistant", `调用失败，请检查 API Key、接口地址或浏览器跨域限制。\n\n错误信息：${error.message}`); // 在页面上显示错误提示
        setStatus("调用失败，请检查配置或打开控制台查看报错。"); // 更新状态栏说明出错
      } finally { // 无论成功还是失败都会执行这里
        isRequesting = false; // 重置请求状态
        sendBtn.disabled = false; // 恢复发送按钮可点击
        clearBtn.disabled = false; // 恢复清空按钮可点击
      } // 请求收尾逻辑结束
    } // 发送请求函数结束

    function clearAll() { // 定义清空全部内容的函数
      documentInput.value = ""; // 清空文档输入框内容
      questionInput.value = ""; // 清空问题输入框内容
      chatHistory = []; // 清空保存的对话历史
      currentDocument = ""; // 清空当前文档缓存
      resetChatBox(); // 重置聊天显示区域
      setStatus("已清空文档和对话记录。"); // 更新状态栏文字
      documentInput.focus(); // 清空后把焦点放回文档输入框
    } // 清空函数结束

    sendBtn.addEventListener("click", askKimi); // 点击发送按钮时触发问答请求
    clearBtn.addEventListener("click", clearAll); // 点击清空按钮时清空全部内容

    questionInput.addEventListener("keydown", (event) => { // 监听问题输入框键盘事件
      if (event.key === "Enter") { // 如果按下的是 Enter 键
        event.preventDefault(); // 阻止默认回车行为，避免表单或页面意外动作
        askKimi(); // 直接触发发送逻辑
      } // Enter 按键判断结束
    }); // 键盘事件监听结束

    documentInput.value = "示例文档：\nKimi 是一个支持长上下文理解与多轮对话的 AI 模型。\n这个页面会把文档内容和用户问题一起发送给模型。\n如果问题超出了文档内容，助手应该明确说明无法从文档中找到答案。"; // 预填一段示例文档，方便用户马上试用
  </script> <!-- 页面脚本结束 -->
