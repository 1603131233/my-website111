<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" data-trae-theme="dark"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI文案生成器 - 真AI多平台版</title>
    <style>
        /* ========== 全局样式 ========== */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
            background: linear-gradient(135deg, #fce7f3, #fbcfe8, #fdf2f8);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
        }

        /* ========== 整体布局容器（桌面端左右双栏） ========== */
        .page-wrapper {
            display: flex;
            gap: 24px;
            max-width: 1100px;
            width: 100%;
            align-items: flex-start;
        }

        /* ========== 主面板 ========== */
        .main-panel {
            flex: 1;
            min-width: 0;
            background: white;
            border-radius: 20px;
            padding: 36px 32px;
            box-shadow: 0 20px 60px rgba(219, 39, 119, 0.12);
        }

        /* ========== 历史记录侧边栏 ========== */
        .history-panel {
            width: 280px;
            flex-shrink: 0;
            background: white;
            border-radius: 20px;
            padding: 24px 20px;
            box-shadow: 0 20px 60px rgba(219, 39, 119, 0.08);
            position: sticky;
            top: 20px;
            max-height: calc(100vh - 40px);
            overflow-y: auto;
        }

        .history-title {
            color: #db2777;
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .history-empty {
            color: #bbb;
            font-size: 13px;
            text-align: center;
            padding: 30px 0;
        }

        /* 每一条历史记录卡片 */
        .history-item {
            background: #fdf2f8;
            border: 1px solid #fce7f3;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .history-item:hover {
            border-color: #f9a8d4;
            box-shadow: 0 2px 8px rgba(219, 39, 119, 0.08);
            transform: translateY(-1px);
        }

        /* 历史记录中的产品名 */
        .history-product {
            font-weight: bold;
            color: #db2777;
            font-size: 14px;
            margin-bottom: 4px;
        }

        /* 历史记录中的风格标签 */
        .history-style {
            display: inline-block;
            background: #fce7f3;
            color: #be185d;
            padding: 1px 8px;
            border-radius: 4px;
            font-size: 11px;
            margin-bottom: 6px;
        }

        /* 历史记录中的文案预览（截断显示） */
        .history-preview {
            color: #999;
            font-size: 12px;
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* ========== 标题区域 ========== */
        h1 {
            text-align: center;
            color: #db2777;
            margin-bottom: 8px;
            font-size: 28px;
        }

        .subtitle {
            text-align: center;
            color: #888;
            font-size: 14px;
            margin-bottom: 24px;
        }

        /* ========== 风格选择按钮组 ========== */
        .style-selector {
            display: flex;
            gap: 8px;
            margin-bottom: 18px;
            flex-wrap: wrap;
            justify-content: center;
        }

        /* 每个风格按钮 */
        .style-btn {
            padding: 9px 16px;
            border: 2px solid #fbcfe8;
            border-radius: 20px;
            background: white;
            color: #be185d;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.25s;
            white-space: nowrap;
            font-weight: 500;
        }

        .style-btn:hover {
            border-color: #db2777;
            background: #fdf2f8;
        }

        /* 选中的风格按钮 */
        .style-btn.active {
            background: linear-gradient(135deg, #db2777, #be185d);
            color: white;
            border-color: transparent;
            box-shadow: 0 4px 12px rgba(219, 39, 119, 0.3);
        }

        /* ========== 输入区域 ========== */
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
        }

        /* 文本输入框 */
        .input-group input {
            flex: 1;
            padding: 14px 18px;
            border: 2px solid #fbcfe8;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
            font-family: inherit;
        }

        .input-group input:focus {
            border-color: #db2777;
            box-shadow: 0 0 0 3px rgba(219, 39, 119, 0.1);
        }

        /* 生成按钮 */
        .generate-btn {
            padding: 14px 28px;
            background: linear-gradient(135deg, #db2777, #be185d);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            white-space: nowrap;
            font-weight: bold;
        }

        .generate-btn:hover {
            transform: scale(1.04);
            box-shadow: 0 4px 16px rgba(219, 39, 119, 0.35);
        }

        .generate-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* ========== 加载动画 ========== */
        .loading {
            text-align: center;
            color: #db2777;
            font-size: 14px;
            display: none;
            padding: 16px 0;
        }

        .loading.show {
            display: block;
        }

        /* 简单的点点点动画 */
        .loading-dots::after {
            content: '';
            animation: dots 1.2s steps(4, end) infinite;
        }

        @keyframes dots {
            0%   { content: ''; }
            25%  { content: '.'; }
            50%  { content: '..'; }
            75%  { content: '...'; }
            100% { content: ''; }
        }

        /* ========== 结果展示区 ========== */
        .result-box {
            background: #fdf2f8;
            border: 2px dashed #f9a8d4;
            border-radius: 14px;
            padding: 20px;
            display: none;
            position: relative;
        }

        .result-box.show {
            display: block;
        }

        /* 结果头部：标题 + 操作按钮 */
        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .result-title {
            color: #db2777;
            font-weight: bold;
            font-size: 15px;
        }

        /* 结果操作按钮组 */
        .result-actions {
            display: flex;
            gap: 8px;
        }

        /* 复制按钮 */
        .btn-copy {
            padding: 7px 14px;
            background: linear-gradient(135deg, #f9a8d4, #f472b6);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .btn-copy:hover {
            transform: scale(1.05);
            box-shadow: 0 2px 8px rgba(244, 114, 182, 0.4);
        }

        /* 重新生成按钮 */
        .btn-regenerate {
            padding: 7px 14px;
            background: linear-gradient(135deg, #e879f9, #c026d3);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .btn-regenerate:hover {
            transform: scale(1.05);
            box-shadow: 0 2px 8px rgba(192, 38, 211, 0.4);
        }

        .btn-regenerate:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* 文案内容 */
        .result-content {
            color: #333;
            line-height: 1.8;
            font-size: 15px;
            white-space: pre-wrap;
            word-break: break-word;
        }

        /* 字数统计 */
        .word-count {
            text-align: right;
            color: #be185d;
            font-size: 12px;
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px dashed #f9a8d4;
        }

        /* ========== 底部标签 ========== */
        .tips {
            margin-top: 18px;
            font-size: 12px;
            color: #aaa;
            text-align: center;
        }

        .tag {
            display: inline-block;
            background: #fce7f3;
            color: #db2777;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            margin-right: 4px;
        }

        /* ========== 响应式：手机端适配 ========== */
        @media (max-width: 768px) {
            .page-wrapper {
                flex-direction: column;
            }

            .history-panel {
                width: 100%;
                position: static;
                max-height: none;
                margin-top: 16px;
            }

            .main-panel {
                padding: 28px 20px;
            }

            h1 {
                font-size: 24px;
            }

            .style-selector {
                gap: 6px;
            }

            .style-btn {
                padding: 7px 12px;
                font-size: 13px;
            }

            .input-group {
                flex-direction: column;
            }

            .generate-btn {
                width: 100%;
                text-align: center;
            }

            .result-header {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>

                userPromptTemplate: (product) => `请为"${product}"写一段朋友圈风格的分享文案，要求：\n1. 生活化表达，像日常发朋友圈一样自然\n2. 真情实感，可以带一点个人故事或场景\n3. 不能有广告感，像真心推荐给朋友\n4. 适当用emoji点缀\n5. 100-150字左右\n6. 可以带一句"配图建议"在末尾（用括号括起来）`
            },
            weibo: {
                label: '微博',
                emoji: '🔥',
                systemPrompt: '你是一个微博热搜体质的博主，擅长写短平快的爆款内容。你的文案风格：热搜感强、短平快、带感、会用网络热梗、带话题标签、善用表情符号、有争议性或共鸣感，容易引发转发和评论。',
                userPromptTemplate: (product) => `请为"${product}"写一段微博风格的文案，要求：\n1. 短平快，一句话能抓住重点\n2. 有热搜体质，容易引发转发和讨论\n3. 带上2-3个相关的#话题标签#\n4. 适当使用网络热梗或俏皮表达\n5. 120字左右\n6. 语气可以夸张一点，有情绪张力`
            }
        };

        // ========================================
        // 功能1：风格选择 —— 切换按钮的 active 状态，更新全局 currentStyle
        // ========================================
        function selectStyle(styleKey, btnElement) {
            // 移除所有按钮的 active 类
            document.querySelectorAll('.style-btn').forEach(btn => btn.classList.remove('active'));
            // 给当前点击的按钮加上 active 类
            btnElement.classList.add('active');
            // 更新全局当前风格
            currentStyle = styleKey;
            // 更新底部标签中的风格名称
            document.getElementById('currentStyleTag').textContent = STYLE_CONFIG[styleKey].label;
        }

        // ========================================
        // 核心函数：调用 Kimi API 生成文案（抽取公共逻辑，供"生成"和"重新生成"共用）
        // ========================================
        async function callKimiAPI(product) {
            // 获取当前风格的配置
            const styleConfig = STYLE_CONFIG[currentStyle];
            // 构建请求消息：系统提示词 + 用户提示词
            const messages = [
                {
                    role: 'system',
                    content: styleConfig.systemPrompt
                },
                {
                    role: 'user',
                    content: styleConfig.userPromptTemplate(product)
                }
            ];

            // 发起 fetch 请求调用 Kimi API
            const response = await fetch('https://api.moonshot.cn/v1/chat/completions', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${API_KEY}`
                },
                body: JSON.stringify({
                    model: 'kimi-k2.6',     // 使用的模型
                    messages: messages,
                    temperature: 1           // 创意度设为1，结果更多样
                })
            });

            const data = await response.json();

            // 如果 API 返回错误，抛出异常
            if (data.error) {
                throw new Error(data.error.message);
            }

            // 返回生成的文案内容
            return data.choices[0].message.content;
        }

        // ========================================
        // 统一的结果展示函数：更新结果区、字数统计、标题
        // ========================================
        function displayResult(copyText, product) {
            // 设置文案内容
            document.getElementById('resultContent').textContent = copyText;
            // 显示结果区域
            document.getElementById('resultBox').classList.add('show');
            // 更新标题（带上产品和风格信息）
            document.getElementById('resultTitle').innerHTML =
                `🎯 ${STYLE_CONFIG[currentStyle].emoji} ${product} · ${STYLE_CONFIG[currentStyle].label}文案`;

            // ====== 功能4：字数统计 —— 计算去除空白后的实际字符数 ======
            const charCount = copyText.replace(/\s/g, '').length;
            document.getElementById('wordCount').textContent = `共 ${charCount} 字`;

            // 重置复制按钮状态（如果之前显示"✅ 已复制"则恢复）
            const copyBtn = document.getElementById('copyBtn');
            copyBtn.textContent = '📋 复制文案';
            copyBtn.style.background = 'linear-gradient(135deg, #f9a8d4, #f472b6)';
        }

        // ========================================
        // 功能2：一键复制文案到剪贴板
        // ========================================
        function copyResult() {
            // 获取当前显示的文案
            const text = document.getElementById('resultContent').textContent;
            if (!text) return;

            // 使用 Clipboard API 复制到剪贴板
            navigator.clipboard.writeText(text).then(() => {
                const btn = document.getElementById('copyBtn');
                // 修改按钮文字和颜色，提示已复制
                btn.textContent = '✅ 已复制';
                btn.style.background = 'linear-gradient(135deg, #34d399, #059669)';
                // 2秒后恢复按钮原状
                setTimeout(() => {
                    btn.textContent = '📋 复制文案';
                    btn.style.background = 'linear-gradient(135deg, #f9a8d4, #f472b6)';
                }, 2000);
            }).catch(() => {
                // 如果 Clipboard API 不可用，使用兼容方案
                const textarea = document.createElement('textarea');
                textarea.value = text;
                textarea.style.position = 'fixed';
                textarea.style.opacity = '0';
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                const btn = document.getElementById('copyBtn');
                btn.textContent = '✅ 已复制';
                btn.style.background = 'linear-gradient(135deg, #34d399, #059669)';
                setTimeout(() => {
                    btn.textContent = '📋 复制文案';
                    btn.style.background = 'linear-gradient(135deg, #f9a8d4, #f472b6)';
                }, 2000);
            });
        }

        // ========================================
        // 功能3：重新生成 —— 用同样产品和风格再生成一版
        // ========================================
        async function regenerate() {
            // 读取当前输入框中的产品名
            const product = document.getElementById('productInput').value.trim();
            if (!product) {
                alert('请先输入产品名称！');
                return;
            }
            // 复用生成逻辑
            await doGenerate(product);
        }

        // ========================================
        // 主生成函数：处理按钮与加载状态，调用 API，展示结果，保存历史
        // ========================================
        async function generateCopy() {
            // 读取输入
            const product = document.getElementById('productInput').value.trim();
            if (!product) {
                alert('请输入产品名称！');
                return;
            }
            await doGenerate(product);
        }

        // ========================================
        // 实际执行生成的核心逻辑
        // ========================================
        async function doGenerate(product) {
            // 获取 DOM 元素
            const generateBtn = document.getElementById('generateBtn');
            const regenerateBtn = document.getElementById('regenerateBtn');
            const loading = document.getElementById('loading');
            const resultBox = document.getElementById('resultBox');

            // 禁用所有操作按钮，防止重复点击
            generateBtn.disabled = true;
            generateBtn.textContent = '⏳ 生成中...';
            if (regenerateBtn) regenerateBtn.disabled = true;
            // 显示加载动画，隐藏旧结果
            loading.classList.add('show');
            resultBox.classList.remove('show');

            try {
                // 调用 Kimi API 获取文案
                const copyText = await callKimiAPI(product);
                // 展示结果
                displayResult(copyText, product);
                // 保存到历史记录
                saveHistory(product, copyText);
            } catch (error) {
                // 错误处理
                alert('生成失败：' + error.message + '\n\n可能原因：\n1. API Key 填错了\n2. 网络连接问题\n3. API 免费额度用完了\n4. Kimi 服务暂时不可用');
            } finally {
                // 恢复按钮状态
                generateBtn.disabled = false;
                generateBtn.textContent = '✨ 生成文案';
                if (regenerateBtn) regenerateBtn.disabled = false;
                loading.classList.remove('show');
            }
        }

        // ========================================
        // 功能5：历史记录管理
        // ========================================

        // 保存一条记录到历史（最多3条，最新的在前面）
        function saveHistory(product, copyText) {
            // 创建历史条目
            const entry = {
                product: product,                                          // 产品名
                style: currentStyle,                                       // 风格代号
                styleLabel: STYLE_CONFIG[currentStyle].label,              // 风格显示名
                styleEmoji: STYLE_CONFIG[currentStyle].emoji,             // 风格图标
                preview: copyText.replace(/\s/g, '').slice(0, 40) + '...', // 截取前40字作为预览
                fullText: copyText                                         // 完整文案
            };
            // 插入到数组最前面
            historyList.unshift(entry);
            // 只保留最近3条
            if (historyList.length > 3) {
                historyList = historyList.slice(0, 3);
            }
            // 刷新历史面板
            renderHistory();
        }

        // 渲染历史记录面板
        function renderHistory() {
            const historyListEl = document.getElementById('historyList');
            const historyEmpty = document.getElementById('historyEmpty');

            if (historyList.length === 0) {
                // 无记录时显示空状态
                historyEmpty.style.display = 'block';
                historyListEl.innerHTML = '';
                return;
            }

            // 隐藏空状态提示
            historyEmpty.style.display = 'none';
            // 生成 HTML
            historyListEl.innerHTML = historyList.map((entry, index) => `
                <div class="history-item" onclick="viewHistory(${index})" title="点击查看完整文案">
                    <div class="history-product">${entry.styleEmoji} ${entry.product}</div>
                    <span class="history-style">${entry.styleLabel}</span>
                    <div class="history-preview">${entry.preview}</div>
                </div>
            `).join('');
        }

        // 点击历史记录条目，在主面板展示完整文案
        function viewHistory(index) {
            const entry = historyList[index];
            if (!entry) return;

            // 切换风格为历史记录中的风格
            currentStyle = entry.style;
            // 更新风格按钮的 active 状态
            document.querySelectorAll('.style-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.dataset.style === entry.style) {
                    btn.classList.add('active');
                }
            });
            // 更新底部风格标签
            document.getElementById('currentStyleTag').textContent = entry.styleLabel;
            // 把产品名回填到输入框
            document.getElementById('productInput').value = entry.product;
            // 展示完整结果
            displayResult(entry.fullText, entry.product);
        }

        // ========================================
        // 键盘事件：回车键也能触发生成
        // ========================================
        document.getElementById('productInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                generateCopy();
            }
        });
    </script>
