<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI文案生成器 - 真AI版</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: "Microsoft YaHei", Arial, sans-serif;
            background: linear-gradient(135deg, #fce7f3, #fbcfe8);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
        }
        
        h1 {
            text-align: center;
            color: #db2777;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-bottom: 30px;
        }
        
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        input {
            flex: 1;
            padding: 15px;
            border: 2px solid #fbcfe8;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }
        
        input:focus {
            border-color: #db2777;
        }
        
        button {
            padding: 15px 30px;
            background: linear-gradient(135deg, #db2777, #be185d);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s;
            white-space: nowrap;
        }
        
        button:hover {
            transform: scale(1.05);
        }
        
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        
        .result-box {
            background: #fdf2f8;
            border: 2px dashed #f9a8d4;
            border-radius: 12px;
            padding: 20px;
            min-height: 150px;
            display: none;
        }
        
        .result-box.show {
            display: block;
        }
        
        .result-title {
            color: #db2777;
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 16px;
        }
        
        .result-content {
            color: #333;
            line-height: 1.8;
            font-size: 15px;
            white-space: pre-wrap;
        }
        
        .loading {
            text-align: center;
            color: #db2777;
            font-size: 14px;
            display: none;
        }
        
        .loading.show {
            display: block;
        }
        
        .tag {
            display: inline-block;
            background: #fce7f3;
            color: #db2777;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            margin-right: 5px;
        }
        
        .tips {
            margin-top: 20px;
            font-size: 12px;
            color: #999;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📝 AI文案生成器</h1>
        <p class="subtitle">接入 Kimi 真AI，输入产品名称，自动生成小红书种草文案</p>
        
        <div class="input-group">
            <input type="text" id="productInput" placeholder="输入产品名称，比如：奶茶、口红、面膜...">
            <button id="generateBtn" onclick="generateCopy()">✨ 生成文案</button>
        </div>
        
        <div class="loading" id="loading">
            🤖 Kimi 正在思考中，请稍候...
        </div>
        
        <div class="result-box" id="resultBox">
            <div class="result-title">🎯 生成结果</div>
            <div class="result-content" id="resultContent"></div>
        </div>
        
        <p class="tips">
            <span class="tag">真AI</span>
            <span class="tag">Kimi</span>
            <span class="tag">小红书风格</span>
            <br><br>
            由 Kimi AI 实时生成，每次结果都不同
        </p>
    </div>

    <script>
        // ========================================
        // 把你的 API Key 填在这里（替换掉引号里的内容）
        // ========================================
        const API_KEY = 'sk-EsbZd1Gl8j21gKrYlAImEQcbr8myT1raqgtqbdliLJZ9n3Jg';
        
        async function generateCopy() {
            const product = document.getElementById('productInput').value.trim();
            const btn = document.getElementById('generateBtn');
            const loading = document.getElementById('loading');
            const resultBox = document.getElementById('resultBox');
            const resultContent = document.getElementById('resultContent');
            
            // 检查输入
            if (!product) {
                alert('请输入产品名称！');
                return;
            }
            
            // 检查 API Key 是否已填写
            if (API_KEY === '你的API_Key' || API_KEY === '') {
                alert('请先填写你的 Kimi API Key！\n\n步骤：\n1. 访问 platform.moonshot.cn 注册\n2. 创建 API Key\n3. 把 Key 填到代码第 15 行');
                return;
            }
            
            // 显示加载状态
            btn.disabled = true;
            btn.textContent = '生成中...';
            loading.classList.add('show');
            resultBox.classList.remove('show');
            
            try {
                // 调用 Kimi API
                const response = await fetch('https://api.moonshot.cn/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${API_KEY}`
                    },
                    body: JSON.stringify({
                        model: 'kimi-k2.6',  // 使用的模型
                        messages: [
                            {
                                role: 'system',
                                content: '你是一个资深的小红书文案博主，擅长写种草文案。你的文案风格：真实、有网感、带emoji、分段清晰、有感染力。'
                            },
                            {
                                role: 'user',
                                content: `请为"${product}"写一段小红书风格的种草文案，要求：\n1. 开头吸引人\n2. 中间讲真实使用感受\n3. 结尾有互动号召\n4. 带emoji\n5. 分段清晰\n6. 150字左右`
                            }
                        ],
                        temperature: 1  // 创意度，越高越有创意
                    })
                });
                
                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error.message);
                }
                
                // 显示结果
                const copyText = data.choices[0].message.content;
                resultContent.textContent = copyText;
                resultBox.classList.add('show');
                
            } catch (error) {
                alert('生成失败：' + error.message + '\n\n可能原因：\n1. API Key 填错了\n2. 网络问题\n3. 免费额度用完了');
            } finally {
                // 恢复按钮状态
                btn.disabled = false;
                btn.textContent = '✨ 生成文案';
                loading.classList.remove('show');
            }
        }
        
        // 回车键也能生成
        document.getElementById('productInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                generateCopy();
            }
        });
    </script>
</body>
</html>
